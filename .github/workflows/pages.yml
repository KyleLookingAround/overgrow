name: Publish to GitHub Pages

on:
  push:
    branches: [main]
    # only what goes into the page: a docs-only merge publishes nothing new
    paths:
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tools/build.mjs'
      - 'tools/rules.mjs'
      - 'tools/join.mjs'
      - 'tools/graph.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing else tests main: two PRs, each green on its own head, can still combine into a broken
  # game. This job runs the same checks a PR does, on main itself, before anything deploys.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - name: npm run check
        run: |
          mkdir -p build
          set -o pipefail
          npm run check 2>&1 | tee build/check.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-failures
          path: build/check
          if-no-files-found: ignore
      - name: Open or update the "main is red" issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const marker = '<!-- main-is-red -->';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${sha}`;
            const commitMsg = (context.payload.head_commit && context.payload.head_commit.message || '').split('\n')[0];
            const log = fs.existsSync('build/check.log') ? fs.readFileSync('build/check.log', 'utf8').split('\n') : [];
            // a failed check group (FAIL  group: …), a failed Vitest test (× or FAIL src/…), or a type error (error TS…)
            const fails = log.filter(l => /^\s*(FAIL|×|✗|error TS\d+|build:)/.test(l)).map(l => l.trim());
            const groups = [...new Set(fails.map(l => l.replace(/^FAIL\s+/, '').split(/[:(]/)[0].trim()))];
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');

            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'bug', per_page: 100});
            const existing = issues.find(i => i.body && i.body.includes(marker));
            const body = [marker,
              '### main is red', '',
              `Failing: ${groups.join(', ') || 'see run'}`,
              ...fails.slice(0, 10).map(l => '- ' + l.replace(/^FAIL\s+/, '')),
              ...(fails.length > 10 ? [`- and ${fails.length - 10} more`] : []),
              '', `Broken by [${sha.slice(0, 7)}](${commitUrl})${commitMsg ? ': ' + commitMsg : ''}`,
              '', `Checked ${now} UTC · [run](${run})`,
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body: `Still red as of ${now} UTC · [run](${run})`});
            } else {
              await github.rest.issues.create({owner, repo, title: 'main is red', body, labels: ['bug']});
            }

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build the page
        run: node tools/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
