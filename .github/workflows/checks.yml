name: Checks

# Runs every check group (npm run check, split across parallel jobs by time; `check` below is the one required status) on each PR that isn't a draft, and on demand. Marking a draft ready for review
# (ready_for_review) runs it too, so a draft is never merged on an older result. Final Call narrowed a draft's run to the
# groups its files touch; with a handful of quick groups that saves nothing yet
# (docs/decisions/ADR-2026-09-28-runbook-from-final-call.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR cancels the older run
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # the browser groups by time (docs/SYSTEMS.md, "CI's limit"): nine parts of about 4 to 7 minutes each, so a run takes under 10, the rest with the
  # typecheck and the Vitest tests
  parts:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: layout phones, groups: layout, layout: a}
          - {name: layout larger, groups: layout, layout: b}
          - {name: scene, groups: scene}
          - {name: zoom, groups: zoom}
          - {name: camera and build, groups: camera build}
          - {name: season and step up, groups: season stepup}
          - {name: explain and unfold, groups: explain unfold}
          - {name: night garden dig and land, groups: night garden dig land}
          - {name: the rest, rest: true}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the graph check diffs against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - name: ${{ matrix.name }}
        env:
          LAYOUT_PART: ${{ matrix.layout }}
        run: |
          if [ "${{ matrix.rest }}" = "true" ]; then
            node tools/build.mjs && npx tsc --noEmit && npx vitest run && node tools/check.mjs --except layout scene zoom camera build season stepup explain unfold night garden dig land
          else
            node tools/build.mjs && node tools/check.mjs ${{ matrix.groups }}
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-failures-${{ matrix.name }}
          path: build/check
          if-no-files-found: ignore

  # the one required status: fails if any part failed or was cancelled
  check:
    if: always() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft)
    needs: parts
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.parts.result }}" = "success"
