name: Checks

# Runs every check group (npm run check) on each PR that isn't a draft, and on demand. Marking a draft ready for review
# (ready_for_review) runs it too, so a draft is never merged on an older result. Final Call narrowed a draft's run to the
# groups its files touch; with a handful of quick groups that saves nothing yet
# (docs/decisions/ADR-2026-09-28-runbook-from-final-call.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR cancels the older run
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the graph check diffs against origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-failures
          path: build/check
          if-no-files-found: ignore
